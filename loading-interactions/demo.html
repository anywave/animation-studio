<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digigami Sprite Animation Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        h1 { text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
        }

        .stage {
            background: rgba(42, 42, 74, 0.8);
            border-radius: 15px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .canvas-container {
            background: radial-gradient(ellipse at bottom, #2a2a4a 0%, #1a1a2e 100%);
            border-radius: 15px;
            padding: 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        #sprite-canvas {
            max-width: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .shadow {
            position: absolute;
            bottom: 30px;
            width: 150px;
            height: 20px;
            background: radial-gradient(ellipse, rgba(0,0,0,0.4) 0%, transparent 70%);
        }

        .playback-controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .frame-info {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }

        .panel {
            background: rgba(42, 42, 74, 0.8);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .panel h2 {
            color: #6a5acd;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            color: #888;
        }

        select, button, input[type="range"] {
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #4a4a6a;
            background: #3a3a5a;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        select:hover, button:hover {
            background: #4a4a6a;
        }

        button.primary {
            background: linear-gradient(180deg, #6a5acd 0%, #5a4abd 100%);
            border-color: #8a7aed;
        }

        button.primary:hover {
            background: linear-gradient(180deg, #7a6add 0%, #6a5acd 100%);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input[type="range"] {
            padding: 5px;
            -webkit-appearance: none;
            background: #3a3a5a;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #6a5acd;
            border-radius: 50%;
            cursor: pointer;
        }

        .animation-list {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 10px;
        }

        .animation-item {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        .animation-item:hover {
            background: rgba(106, 90, 205, 0.3);
        }

        .animation-item.active {
            background: rgba(106, 90, 205, 0.5);
        }

        .fps-display {
            text-align: center;
            font-size: 1.2rem;
            color: #6a5acd;
            font-weight: bold;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 300px;
            color: #888;
        }

        .loading::after {
            content: '';
            width: 30px;
            height: 30px;
            border: 3px solid #4a4a6a;
            border-top-color: #6a5acd;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            color: #ff6b6b;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Digigami Sprite Animation</h1>
    <p class="subtitle">Character animations from spritesheets</p>

    <div class="container">
        <div class="stage">
            <div class="canvas-container">
                <canvas id="sprite-canvas"></canvas>
                <div class="shadow"></div>
                <div class="loading" id="loading">Loading spritesheet...</div>
                <div class="error" id="error" style="display: none;"></div>
            </div>

            <div class="playback-controls">
                <button id="play-btn" class="primary" disabled>▶ Play</button>
                <button id="pause-btn" disabled>⏸ Pause</button>
                <button id="stop-btn" disabled>⏹ Stop</button>
                <button id="prev-btn" disabled>◀ Prev</button>
                <button id="next-btn" disabled>Next ▶</button>
            </div>

            <div class="frame-info" id="frame-info">
                Frame: <span id="current-frame">-</span> / <span id="total-frames">-</span>
            </div>
        </div>

        <div class="panel">
            <h2>Controls</h2>
            <div class="controls">
                <div class="control-group">
                    <label>Character</label>
                    <select id="character-select">
                        <option value="kyur">Kyur</option>
                        <option value="gwynn">Gwynn</option>
                        <option value="urahara">Urahara</option>
                        <option value="yoroiche">Yoroiche</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Animation Speed</label>
                    <input type="range" id="fps-slider" min="1" max="24" value="8">
                    <div class="fps-display"><span id="fps-value">8</span> FPS</div>
                </div>

                <div class="control-group">
                    <label>Scale</label>
                    <select id="scale-select">
                        <option value="0.25">25%</option>
                        <option value="0.5" selected>50%</option>
                        <option value="0.75">75%</option>
                        <option value="1">100%</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Animations</label>
                    <div class="animation-list" id="animation-list">
                        <div class="animation-item" data-anim="all">All Frames (Turnaround)</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="SpriteAnimator.js"></script>
    <script>
        const canvas = document.getElementById('sprite-canvas');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const characterSelect = document.getElementById('character-select');
        const fpsSlider = document.getElementById('fps-slider');
        const fpsValue = document.getElementById('fps-value');
        const scaleSelect = document.getElementById('scale-select');
        const animationList = document.getElementById('animation-list');
        const currentFrameSpan = document.getElementById('current-frame');
        const totalFramesSpan = document.getElementById('total-frames');

        const playBtn = document.getElementById('play-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const stopBtn = document.getElementById('stop-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        let animator = null;
        let allFrameNames = [];
        let currentFrameIndex = 0;

        async function loadCharacter(character) {
            loading.style.display = 'flex';
            loading.textContent = `Loading ${character} spritesheet...`;
            error.style.display = 'none';
            canvas.style.display = 'none';
            disableControls();

            console.log(`Loading character: ${character}`);

            animator = new SpriteAnimator(canvas, {
                fps: parseInt(fpsSlider.value),
                scale: parseFloat(scaleSelect.value),
                onLoad: (metadata) => {
                    console.log('Spritesheet loaded:', metadata.meta);
                    console.log('Frames:', Object.keys(metadata.frames).length);
                    loading.style.display = 'none';
                    canvas.style.display = 'block';
                    enableControls();
                    updateAnimationList(metadata);
                }
            });

            const success = await animator.load(character);
            console.log('Load result:', success);

            if (!success) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = `Failed to load ${character} spritesheet. Check browser console for details.`;
                return;
            }

            allFrameNames = animator.getFrameNames();
            totalFramesSpan.textContent = allFrameNames.length;
            currentFrameSpan.textContent = '1';

            // Find a good starting frame (prefer "default" or front-facing)
            let startFrame = allFrameNames.find(f => f.includes('default')) ||
                             allFrameNames.find(f => f.includes('front')) ||
                             allFrameNames[0];

            if (startFrame) {
                currentFrameIndex = allFrameNames.indexOf(startFrame);
                currentFrameSpan.textContent = currentFrameIndex + 1;
            }

            // Set up default animation (all frames) so play button works immediately
            animator.currentAnimation = allFrameNames;
            animator.currentFrameIndex = currentFrameIndex;
            animator.loop = true;

            // Show the starting frame
            animator.showFrame(startFrame);
        }

        function updateAnimationList(metadata) {
            animationList.innerHTML = '';

            // Add "All Frames" option
            const allItem = document.createElement('div');
            allItem.className = 'animation-item active';
            allItem.dataset.anim = 'all';
            allItem.textContent = `All Frames (${animator.getFrameNames().length})`;
            allItem.onclick = () => selectAnimation('all');
            animationList.appendChild(allItem);

            // Add named animations
            const animations = metadata.animations || {};
            for (const [name, frames] of Object.entries(animations)) {
                if (frames && frames.length > 0) {
                    const item = document.createElement('div');
                    item.className = 'animation-item';
                    item.dataset.anim = name;
                    item.textContent = `${name} (${frames.length})`;
                    item.onclick = () => selectAnimation(name);
                    animationList.appendChild(item);
                }
            }
        }

        function selectAnimation(name) {
            // Update active state
            document.querySelectorAll('.animation-item').forEach(item => {
                item.classList.toggle('active', item.dataset.anim === name);
            });

            currentFrameIndex = 0;

            if (name === 'all') {
                animator.playAll();
            } else {
                animator.playAnimation(name);
            }
        }

        function disableControls() {
            playBtn.disabled = true;
            pauseBtn.disabled = true;
            stopBtn.disabled = true;
            prevBtn.disabled = true;
            nextBtn.disabled = true;
        }

        function enableControls() {
            playBtn.disabled = false;
            pauseBtn.disabled = false;
            stopBtn.disabled = false;
            prevBtn.disabled = false;
            nextBtn.disabled = false;
        }

        // Event listeners
        characterSelect.onchange = () => loadCharacter(characterSelect.value);

        fpsSlider.oninput = () => {
            fpsValue.textContent = fpsSlider.value;
            if (animator) animator.setFPS(parseInt(fpsSlider.value));
        };

        scaleSelect.onchange = () => {
            if (animator) {
                animator.resize(parseFloat(scaleSelect.value));
                // Re-render current frame
                if (allFrameNames.length > 0) {
                    animator.showFrame(allFrameNames[currentFrameIndex]);
                }
            }
        };

        playBtn.onclick = () => {
            if (animator) {
                // If no animation is set, play all frames
                if (!animator.currentAnimation || animator.currentAnimation.length === 0) {
                    animator.playAll();
                } else {
                    animator.play();
                }
            }
        };

        pauseBtn.onclick = () => {
            if (animator) animator.pause();
        };

        stopBtn.onclick = () => {
            if (animator) {
                animator.stop();
                currentFrameIndex = 0;
                currentFrameSpan.textContent = '1';
            }
        };

        prevBtn.onclick = () => {
            if (animator && allFrameNames.length > 0) {
                animator.pause();
                currentFrameIndex = (currentFrameIndex - 1 + allFrameNames.length) % allFrameNames.length;
                animator.showFrame(allFrameNames[currentFrameIndex]);
                currentFrameSpan.textContent = currentFrameIndex + 1;
            }
        };

        nextBtn.onclick = () => {
            if (animator && allFrameNames.length > 0) {
                animator.pause();
                currentFrameIndex = (currentFrameIndex + 1) % allFrameNames.length;
                animator.showFrame(allFrameNames[currentFrameIndex]);
                currentFrameSpan.textContent = currentFrameIndex + 1;
            }
        };

        // Track current frame during playback
        setInterval(() => {
            if (animator && animator.isPlaying) {
                currentFrameSpan.textContent = animator.currentFrameIndex + 1;
            }
        }, 100);

        // Initial load
        loadCharacter('kyur');
    </script>
</body>
</html>
